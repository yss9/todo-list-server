# .github/workflows/main.yml

# 워크플로우의 이름
name: CI/CD for Todo List Server

# 워크플로우가 실행될 조건 (main 브랜치에 push가 발생했을 때)
on:
  push:
    branches: [ "main" ]

# 실행될 작업(Job)들의 목록
jobs:
  # build-and-deploy 라는 이름의 작업
  build-and-deploy:
    # 이 작업이 실행될 가상 환경의 종류
    runs-on: ubuntu-latest

    # 작업 내에서 실행될 단계(Step)들의 목록
    steps:
      # 1. 소스 코드 체크아웃
      - name: Checkout source code
        uses: actions/checkout@v3

      # 2. AWS 자격 증명 설정
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 3. Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Docker 이미지 빌드 및 푸시
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/todo-list-server:latest

      # 5. EC2에 배포
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_PEM_KEY }}
          script: |
            docker stop todo-app-container || true
            docker rm todo-app-container || true
            
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/todo-list-server:latest
            
            docker run -d -p 80:3000 \
              --name todo-app-container \
              -e RDS_USERNAME=${{ secrets.RDS_USERNAME }} \
              -e RDS_PASSWORD=${{ secrets.RDS_PASSWORD }} \
              -e RDS_HOSTNAME=${{ secrets.RDS_HOSTNAME }} \
              -e RDS_DB_NAME=${{ secrets.RDS_DB_NAME }} \
              -e RDS_PORT=${{ secrets.RDS_PORT }} \
              ${{ secrets.DOCKERHUB_USERNAME }}/todo-list-server:latest